name: Run CI/CD

on:
  push:
    branches: 
      - main  # mainブランチへの直接pushによるトリガー
  pull_request:
    types: [opened, synchronize, reopened]  # PR作成時・更新時にトリガー
    branches: ["**"]  # すべてのブランチへのPRをトリガー

# 明示的なパーミッション設定
permissions:
  contents: read # リポジトリコンテンツの読み取り権限
  issues: write
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # node_modulesとbun-cacheのキャッシングを手動で実装
      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Run linter
        run: bun run check

      # lefthookを回避したコミット(--no-verify)でも型エラーをCIで検出する
      - name: Run type check
        run: bun run typecheck

      # ADRインデックス表とdocs/adr/配下のファイルの整合性を検証する
      - name: Run ADR index check
        run: bun run check:adr

  test:
    runs-on: ubuntu-latest
    # lintの後に実行
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # node_modulesとbun-cacheのキャッシングを手動で実装
      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun run test

