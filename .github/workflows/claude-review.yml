name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review, labeled]  # PR作成・Draft解除で自動実行、`claude-review` ラベル付与で手動再実行
    branches:
      - develop  # 機能PR: Hard Rules / 業務ルール / bugs
      - 'staging*'  # develop → staging の昇格PR（stand-in の staging_testing 含む）: 上記 + 既知課題（INVESTIGATION_09）の進捗表

jobs:
  review:
    # labeled は `claude-review` ラベルのときだけ実行（Draft でも実行してラベルを外す）、それ以外は Draft を除外
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'claude-review') ||
      (github.event.action != 'labeled' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ startsWith(github.base_ref, 'staging') && 60 || 30 }}  # 昇格PRは差分が大きいため長め
    # 同一PRで実行中のレビューがあれば中断し、最新の実行のみ残す
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write  # インラインレビューコメントの投稿
      issues: write  # 実行後にトリガー用ラベルを外す
    steps:
      # リポジトリ内スキル `.claude/skills/winwin-pr-review` を読むためチェックアウトが必要
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # GITHUB_TOKEN で認証し、github-actions bot としてPRにコメントを投稿する
      # レビュー用データを事前生成し、Claude 側の Bash 依存（パイプ・リダイレクト・paginate）を無くす
      - name: Prepare review data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          D=.review-data; mkdir -p "$D"
          gh api "repos/$REPO/pulls/$PR" --jq '{number,title,body,state,draft,author:.user.login,base:.base.ref,base_sha:.base.sha,head:.head.ref,head_sha:.head.sha,changed_files,additions,deletions}' > "$D/pr.json"
          gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | [.status, .additions, .deletions, .filename] | @tsv' > "$D/files.tsv"
          gh api "repos/$REPO/pulls/$PR/comments" --paginate --slurp | jq '[.[][] | {path, line, user: .user.login, body: (.body | .[0:200])}]' > "$D/inline-comments.json"
          gh api "repos/$REPO/issues/$PR/comments" --paginate --slurp | jq '[.[][] | {user: .user.login, created_at, body: (.body | .[0:300])}]' > "$D/issue-comments.json"
          git fetch --quiet --depth=1 origin "$BASE_SHA"
          git diff "$BASE_SHA" HEAD > "$D/full.diff"
          grp() { git diff "$BASE_SHA" HEAD -- "$@"; }
          grp 'src/server/api' > "$D/G1-routers.diff"
          grp 'src/app/api' > "$D/G2-api-routes.diff"
          grp 'src/server' ':(exclude)src/server/api' 'src/env.js' > "$D/G3-server-modules.diff"
          grp 'src/app' ':(exclude)src/app/api' > "$D/G4-pages.diff"
          grp 'src/components' 'src/lib' 'src/hooks' 'src/trpc' 'src/types' 'src/styles' > "$D/G5-ui-lib.diff"
          grp '.' ':(exclude)src' ':(exclude)docs' ':(exclude).agents' ':(exclude).claude' ':(exclude)*.md' ':(exclude).github/ISSUE_TEMPLATE' > "$D/G6-config.diff"
          : > "$D/groups.tsv"
          for f in "$D"/G*.diff "$D/full.diff"; do
            printf '%s\t%s files\t%s lines\n' "$(basename "$f")" "$(grep -c '^diff --git' "$f" || true)" "$(wc -l < "$f" | tr -d ' ')" >> "$D/groups.tsv"
          done
          echo "== groups =="; cat "$D/groups.tsv"; echo "files: $(wc -l < "$D/files.tsv")"

      - name: Run Claude code review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "/winwin-pr-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # --allowedTools がインラインコメント投稿用のMCPサーバーを有効にする
          claude_args: |
            --model claude-opus-5
            --max-turns ${{ startsWith(github.base_ref, 'staging') && 80 || 40 }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Write"

      # Claude が 0 ターンで終了した場合（スキル未ロード）はジョブを失敗させる。
      # スキルがベースブランチに未マージの間は警告のみ（アクションは .claude/ をベースブランチから復元する）
      - name: Fail if Claude did not run
        if: steps.claude.outcome == 'success'
        env:
          BASE_REF: ${{ github.base_ref }}
          SKILL_PATH: .claude/skills/winwin-pr-review/SKILL.md
        run: |
          FILE="${{ steps.claude.outputs.execution_file }}"
          if [ ! -f "$FILE" ]; then echo "::error::Claude execution file not found: $FILE"; exit 1; fi
          TURNS=$(jq -s 'flatten | map(select(type == "object" and .type == "result")) | last | .num_turns // 0' "$FILE")
          echo "num_turns=$TURNS"
          if [ "$TURNS" -ne 0 ]; then exit 0; fi
          git fetch --quiet --depth=1 origin "$BASE_REF"
          if git cat-file -e "FETCH_HEAD:${SKILL_PATH}" 2>/dev/null; then
            echo "::error::Claude finished with 0 turns although ${SKILL_PATH} exists on ${BASE_REF}. Check the skill frontmatter and the prompt in this workflow."
            exit 1
          fi
          echo "::warning::Claude finished with 0 turns because ${SKILL_PATH} is not on ${BASE_REF} yet. The action restores .claude/ from the base branch, so the review only works after this PR is merged."

      # 次回の手動再実行に備えてトリガー用ラベルを外す
      - name: Remove trigger label
        if: always() && github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method DELETE "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/claude-review" \
            || echo "::warning::claude-review label was already removed"
